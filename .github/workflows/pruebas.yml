name: Pruebas y publicación

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Instalar Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Ejecutar las pruebas
        run: npm test
      - name: Guardar capturas si algo falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: capturas-de-fallos
          path: tests/resultados/

  publicar:
    # Solo se publica si las pruebas pasan (requiere Settings → Pages → Source: GitHub Actions).
    needs: pruebas
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Preparar la web
        run: |
          mkdir _site
          cp -r index.html css js lib icons manifest.webmanifest sw.js favicon.ico version.json .nojekyll _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
